# 3D photonic interposer: public facts with exact quotes (brief 05 phase 4 fact check, 2026-10-18).
# Independent model built from public information. Not affiliated with or endorsed by
# any company whose publications are cited.

[product]
name = "3D photonic interposer"
family = "photonic interconnect"
kind = "product"
status = "Public technical material and Hot Chips 2025 talk"
summary = "3D photonic superchip: a multi-tile active photonic interposer under a large package, with edge-attached fibers carrying WDM microring links (vendor description)."

[[fact]]
id = "interposer.bw_total_pr"
quantity = "total optical bandwidth (press release; Tx/Rx counting not stated)"
value = 114.0
bound = "exact"
unit = "Tbps"
quote = "114 Tbps total optical bandwidth"
cite = "vendor_pr_interposer"
source_class = "vendor_claim"
verified = true
location = "paragraph 1 (dateline paragraph)"
note = "Evidence: text. Matches. The PR says 'total' but not whether it counts Tx + Rx; HC25 slide 11 says '(Tx + Rx)' and the EVK page says 'Total bi-directional'. Arithmetic, not a source statement: 256 fibers x 448 Gbps = 1024 SerDes x 56 Gbps x 2 directions = 114.688 Tbps."

