# Switch tray 204.8T (model card §14.7). Units: mm; x width, y depth (front at -y), z up.
# Width and height from the ORv3 IT gear guide; every internal part is SCHEMATIC: the release
# discloses no layout, lane rate, fibers per engine, wavelengths, power or switch ASIC.

