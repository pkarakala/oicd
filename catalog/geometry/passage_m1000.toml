# Passage M1000 (model card §14.3). Units: mm; x, y in the package plane, z up.
# Package footprint 91 x 85 mm (VENDOR); the interposer tiling and every die are SCHEMATIC.

[scene]
id = "passage_m1000"
name = "Passage M1000 photonic superchip"
unit = "mm"
level = "package"
product = "passage_m1000"
breadcrumb = "M1000"
summary = "An 8-tile active photonic interposer under a 91 x 85 mm package: 34 chiplets on top, 256 edge-attached fibers, optical I/O sites across the area."

[[part]]
id = "m1k.package"
name = "package (91 x 85 mm)"
assembly = "package"
size = [91.0, 85.0, 2.0]
position = [0.0, 0.0, 1.0]
material = "organic_substrate"
dims_class = "SCHEMATIC"
dims_axes = ["VENDOR", "VENDOR", "SCHEMATIC"]
dims_source = "m1000.package_length_mm"
nodes = ["m1000.package_length_mm", "m1000.package_width_mm", "m1000.package_area", "m1000.power_delivery"]
function = "7,735 mm2 package with 1.5 kW power delivery; thickness schematic."
explode = [0.0, 0.0, -8.0]
label = "91 x 85 mm"

[[part]]
id = "m1k.tiles"
name = "interposer tiles (8, 2 x 4)"
assembly = "interposer"
size = [25.0, 20.0, 0.8]
position = [-12.5, -30.0, 2.4]
material = "silicon"
dims_class = "SCHEMATIC"
dims_source = "Tile size not disclosed; drawn 25 x 20 mm so 8 tiles total 4000 mm2 (INFERENCE area)."
nodes = ["m1000.interposer_area", "m1000.tile_count", "m1000.tile_arrangement", "m1000.serdes_per_tile"]
function = "Active photonic interposer: waveguides, modulators and photodiodes under the chiplets."
count = 8
grid = [2, 4, 1]
pitch = [25.0, 20.0, 0.0]
label = "interposer tile"

[[part]]
id = "m1k.io_chiplets"
name = "I/O chiplets (32)"
assembly = "chiplets"
size = [9.0, 7.0, 0.8]
position = [-18.75, -35.0, 3.2]
material = "silicon_eic"
dims_class = "SCHEMATIC"
dims_source = "Chiplet size not disclosed; 4 per tile drawn."
nodes = ["m1000.io_chiplets", "m1000.chiplets", "m1000.serdes_count"]
count = 32
grid = [4, 8, 1]
pitch = [12.5, 10.0, 0.0]
explode = [0.0, 0.0, 10.0]
label = "I/O chiplets"

[[part]]
id = "m1k.thermal_chips"
