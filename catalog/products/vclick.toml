# vClick optics: public facts with exact quotes (brief 05 phase 4 fact check, 2026-10-18).
# Independent reconstruction from public information. Not affiliated with or endorsed by
# Lightmatter. Product names belong to their owners.

[product]
name = "vClick optics"
family = "Passage"
kind = "product"
status = "Announced 2026-03-11 (vendor and partner releases)"
summary = "Detachable fiber-array unit with vertical expanded-beam coupling to the PIC, built with SENKO (vendor and partner descriptions)."

[[fact]]
id = "vclick.il_reinsertion_max"
quantity = "vClick detachable FAU insertion and re-insertion loss, demonstrated (no wavelength, mating-cycle count or measurement conditions stated)"
value = 1.5
bound = "max"
unit = "dB"
quote = "A demonstrated insertion and re-insertion loss of less than 1.5 dB"
cite = "lm_pr_vclick"
source_class = "vendor_claim"
verified = true
conflicts_with = ["vclick.il_futurum"]
location = "'Key advantages' list, 'Field Serviceability' item; paragraph 1 also says 'demonstrating a low insertion loss of less than 1.5 dB'"
note = "Evidence: text."

[[fact]]
id = "vclick.wdm_span_nm"
quantity = "Spectral span over which vClick supports CWDM and DWDM (Lightmatter wording)"
value = 80.0
bound = "min"
unit = "nm"
quote = "Supports broadband (up to 80+ nanometers) Coarse Wavelength Division Multiplexing (CWDM) and Dense Wavelength Division Multiplexing (DWDM)"
cite = "lm_pr_vclick"
source_class = "vendor_claim"
verified = true
location = "'Key advantages' list, 'High Bandwidth DWDM Compatibility' item"
note = "Evidence: text. Wording only: Lightmatter writes 'up to 80+ nanometers' ('up to' qualifying an open-ended '80+'); SENKO writes 'more than 80 nm of spectrum' (vclick.wdm_span_nm_senko). Recorded as min 80 nm. Neither source gives band edges or a center wavelength."

