id = "ptc.optical_total"
fn = "total_w_from_mw"
inputs = ["ptc.laser_count", "ptc.laser_power_fibre"]
unit = "W"
note = "laser power in fibre, 8 × 200 mW"

[[derived]]
id = "ptc.output_word_bits"
fn = "abfp_output_bits"
inputs = ["ptc.weight_bits", "ptc.activation_bits", "ptc.output_range"]
unit = "bits"
note = "bits of the dot-product word under the ADC-range reading"

[[derived]]
id = "ptc.loss_front"
fn = "sum2"
inputs = ["ptc.vgroove_loss", "ptc.vmod_il"]
unit = "dB"
note = "V-groove coupling plus vector modulator insertion loss"

[[derived]]
id = "ptc.loss_to_cell"
fn = "sum2"
inputs = ["ptc.loss_front", "ptc.path_loss_db"]
unit = "dB"
note = "fibre to weight cell, before any splitter excess"

[[derived]]
id = "ptc.loss_to_cell_total"
fn = "sum2"
inputs = ["ptc.loss_to_cell", "ptc.splitter_excess_db"]
unit = "dB"
note = "fibre to weight cell under the laser-mapping hypothesis"

[[derived]]
id = "ptc.cells_total"
fn = "times_count"
inputs = ["ptc.ptc_count", "ptc.cells_per_ptc"]
unit = "count"
note = "weight cells in all four PTCs"

[[derived]]
id = "ptc.power_per_cell"
fn = "power_per_cell_uw"
inputs = ["ptc.optical_total", "ptc.loss_to_cell_total", "ptc.cells_total"]
unit = "uW"
note = "optical power per weight cell (model card §15.5)"

[[check]]
id = "ptc.check_ops_500mhz"
kind = "consistent"
a = "ptc.ops_500mhz"
b = "ptc.throughput_sustained"
rel_tol = 0.01
note = "65.536 TOPS against '65.5 trillion' operations per second"

[[check]]
id = "ptc.check_ops_2ghz"
kind = "consistent"
a = "ptc.ops_2ghz"
b = "ptc.throughput_peak"
rel_tol = 0.01
note = "262.144 TOPS against '262 trillion' at 2 GHz"

[[check]]
id = "ptc.check_power"
kind = "consistent"
a = "ptc.power_sum"
b = "ptc.power_electrical"
rel_tol = 0.01
note = "4 × 3.2 W + 65 W against 78 W (lasers excluded)"

[[check]]
id = "ptc.check_ptc_area"
kind = "consistent"
a = "ptc.ptc_area_calc"
b = "ptc.ptc_area"
rel_tol = 0.01
note = "14.00 × 24.96 mm against '349-mm2'"

[[check]]
id = "ptc.check_dci_area"
kind = "consistent"
a = "ptc.dci_area_calc"
b = "ptc.dci_area"
rel_tol = 0.01
note = "31.4 × 25.0 mm against 'approximately 780 mm2'"

[[check]]
id = "ptc.check_optical"
kind = "consistent"
a = "ptc.optical_total"
b = "ptc.power_optical"
rel_tol = 0.01
note = "8 × 200 mW against '1.6 W of optical power'"

[[check]]
id = "ptc.check_efficiency"
kind = "consistent"
a = "ptc.tops_per_w_calc"
b = "ptc.tops_per_w_system_avg"
rel_tol = 0.05
note = "65.536 TOPS / 78 W against the SI's 0.81 TOPS/W average"

[[check]]
id = "ptc.check_output_bits"
kind = "consistent"
a = "ptc.output_word_bits"
b = "ptc.output_bits_total"
rel_tol = 0.05
note = "ABFP word bits under the ADC-range reading against the SI's 24-bit output (one sign bit of slack)"

[[hypothesis]]
id = "H_out_n"
statement = "The 11-bit ADC spans the full range of the 128-term sum, ±n (basumallik2022_abfp Eq. 3)."
sets = { "ptc.output_range" = 128.0 }
group = "ptc_out_range"

[[hypothesis]]
id = "H_out_1"
statement = "The SI's Q_11 applies its [−1, +1] clamp to the 128-term sum as written."
sets = { "ptc.output_range" = 1.0 }
group = "ptc_out_range"

[[hypothesis]]
id = "H_lasers_dedicated"
statement = "Each PTC is fed by two of the eight lasers; no extra splitter stage."
sets = { "ptc.splitter_excess_db" = 0.0 }
group = "ptc_laser_map"

[[hypothesis]]
id = "H_lasers_shared"
statement = "Each laser is split four ways to all PTCs; one more splitter stage with 0.5 dB excess (SYNTHETIC)."
sets = { "ptc.splitter_excess_db" = 0.5 }
group = "ptc_laser_map"
