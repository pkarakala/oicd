# Guide, Guide 1 and Guide DR laser sources (model card §14.5). Units: mm; x across, y depth
# (faceplate at -y), z up. Only the Guide DR card's depth is a published dimension (OCP NIC 3.0,
# 115 mm for both sizes); its width is our SFF reading of "built to OCP NIC 3.0 dimensions".
# Every package, chip, laser and fiber position is SCHEMATIC.

[scene]
id = "guide_family"
name = "Guide, Guide 1 and Guide DR laser sources"
unit = "mm"
level = "package"
product = "guide_family"
parent = "switch_tray"
breadcrumb = "Guide DR"
summary = "External laser sources: the Guide DR laser NIC (64 lasers, 64 fibers at 200 mW), a Guide 1 package (8 wavelengths per fiber, 16 fibers, stackable) and the first Guide validation module (32 fibers)."

[[part]]
id = "gdr.pcb"
name = "Guide DR laser NIC (LNIC) board"
assembly = "Guide DR"
size = [76.0, 115.0, 1.6]
position = [0.0, 0.0, 0.8]
material = "pcb"
dims_class = "SCHEMATIC"
dims_axes = ["INFERENCE", "PUBLISHED", "SCHEMATIC"]
dims_source = "nic3.sff_depth"
nodes = ["guidedr.form_factor", "nic3.sff_width", "nic3.lff_width", "nic3.sff_depth", "guidedr.bw_per_module"]
function = "Built to OCP NIC 3.0 dimensions, size not named: drawn as SFF (76 x 115 mm); LFF would be 139 x 115 mm. Board thickness schematic."
label = "OCP NIC 3.0 card"

[[part]]
id = "gdr.faceplate"
name = "faceplate"
assembly = "Guide DR"
size = [76.0, 1.5, 12.0]
position = [0.0, -58.25, 6.0]
material = "aluminium"
dims_class = "SCHEMATIC"
dims_axes = ["INFERENCE", "SCHEMATIC", "SCHEMATIC"]
dims_source = "nic3.sff_width"
function = "Front bracket; width follows the board."

