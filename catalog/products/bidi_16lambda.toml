note = "Evidence: text. Inconsistent with this page's own 400 Gbps per direction over 8 wavelengths (= 50 Gbps per wavelength; 8 x 56 = 448 Gbps), with vendor_blog_doubling ('each channel operating at 50 Gbps') and with vendor_yole_ofc26 slide 9 for the 16λ BiDi kit ('8λ/fiber, 50 Gbps/λ'; panel 'SerDes Speed 50 Gbps'). No source explains the 56 Gbps figure."

[[fact]]
id = "bidi16.kitbidi_efficiency_pj_bit"
