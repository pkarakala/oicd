assembly = "chiplets"
size = [6.0, 30.0, 0.8]
position = [-36.0, 0.0, 3.2]
material = "silicon_eic"
dims_class = "SCHEMATIC"
dims_source = "Thermal load chips' size not disclosed."
nodes = ["m1000.thermal_load_chips"]
count = 2
grid = [2, 1, 1]
pitch = [72.0, 0.0, 0.0]
explode = [0.0, 0.0, 10.0]

[[part]]
id = "m1k.io_sites"
