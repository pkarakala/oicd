source_class = "peer_reviewed"
verified = true
location = "Supplementary Information; SI Table S3, row 'This work (2024)', p.10"
note = "Evidence: text. The initial fact list quotes a main-text sentence that could not be checked (main text paywalled). The values are in SI Table S3, and the vendor blog (vendor_blog_newcomputer) words it as 'the processor performs 65.5 trillion Adaptive Block Floating-Point 16-bit (ABFP) operations per second, consuming only 78 watts of electrical power and 1.6 watts of optical power'. Arithmetic check (inference): 65,536 MACs/cycle x 2 ops x 500 MHz = 65.5 TOPS."

