[[fact]]
id = "fau.il_futurum"
quantity = "FAU insertion loss as relayed by Futurum from the vendor (analyst report of a verbal company claim)"
value = 1.0
bound = "max"
unit = "dB"
quote = "[the vendor] told Futurum the connector demonstrates insertion loss below 1 dB"
cite = "futurum_ocp26"
source_class = "third_party"
verified = true
location = "section 'Serviceable Connectors and Laser Supply Address CPO’s Two Hardest Objections', paragraph 1; repeated in 'What to Watch' ('sub-1 dB detachable loss')"
note = "Evidence: text. CONFLICT with both March 2026 releases (vendor_pr_fau, senko_pr_fau), which claim insertion and re-insertion loss 'less than 1.5 dB'. Futurum attributes the sub-1 dB figure to the vendor verbally and recasts ~1.5 dB as 'an industry benchmark near 1.5 dB for permanently attached fiber requiring active alignment'. No vendor document in this group states < 1 dB. The article carries a generative-AI assistance disclosure."

