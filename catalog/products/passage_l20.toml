[[fact]]
id = "l20.energy_per_bit_bw"
quantity = "L20 energy per bit stated beside max TDP (Business Wire copy)"
value = 3.0
bound = "exact"
unit = "pJ/bit"
quote = "TDP (max): 30W (3.0 pJ/bit)"
cite = "lm_pr_l20_bw"
source_class = "vendor_claim"
verified = true
conflicts_with = ["l20.energy_per_bit_web", "l20.energy_per_bit_yole"]
location = "Preliminary Specifications list (Wayback capture of businesswire.com, SRC/lm_pr_l20_bw_retry/raw.html.txt; same line in Yahoo Finance syndication)"
note = "Evidence: text. Exact wording is 'TDP (max): 30W (3.0 pJ/bit)'. businesswire.com returned 403 to curl and WebFetch; verified from an Internet Archive capture of the businesswire.com page and from the Yahoo Finance syndication of the same Business Wire release. The lightmatter.co copy (lm_pr_l20) and Lightmatter's PDF of it say only 'TDP (max): 30W'. Conflicts with '5 pJ/bit' (lm_web_l20, lm_yole_ofc26). My arithmetic: 30 W / 6.4 Tbps = 4.69 pJ/bit and 30 W / 12.8 Tbps = 2.34 pJ/bit, so 3.0 does not follow from 30 W."

