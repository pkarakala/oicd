[[fact]]
id = "ptc.abfp_scale_formulas"
quantity = "ABFP scale choice (max-abs) and normalization to [-1, 1]"
bound = "exact"
unit = "text"
quote = "we normalize every bfloat16 vector with a scale s_x = max(|x⃗|) (the scale is in bfloat16) and then quantize the resulting vector x̂ (which now has a value between -1 and 1 only) to 10 bits by the DAC, which we denote with the function Q_10. Similarly, we normalize every row vector of the bfloat16 weight with a scale s_w;i = max(|w⃗_i|), where w⃗_i denotes row i of the weight matrix w. The resulting vector ŵ_i (which has a value between -1 and 1) is then quantized to 7 bits by the DAC, denoted with Q_7."
cite = "ahmed2025_nature"
source_class = "peer_reviewed"
verified = true
location = "Supplementary Information; SI PDF page 2, rendered to PNG with pypdfium2 (linear transcription of typeset math)"
note = "Evidence: image."

[[fact]]
id = "ptc.abfp_qn_formula"
quantity = "symmetric DAC quantizer Q_n (n = 7 weights, 10 activations; Q_11 at the ADC)"
bound = "exact"
unit = "text"
quote = "Q_n(α) = clamp_[−1,+1](round(α/δ_n) · δ_n), where clamp_[−1,+1](β) = max(min(β, 1), −1) and δ_n = 1/(2^(n−1) − 1)"
cite = "ahmed2025_nature"
source_class = "peer_reviewed"
verified = true
location = "Supplementary Information; SI PDF page 2, rendered to PNG with pypdfium2 (linear transcription of typeset math)"
note = "Evidence: image. The pypdf text loses the fraction bar (it reads 'round(αδ𝑛)'); the rendered page shows α over δ_n. The SI does not give a tie rule for round(); basumallik2022_abfp says round-half-to-even (ptc.abfp_rounding). The SI applies Q_11 with its [−1,+1] clamp directly to the N-term sum without stating the 1/N scaling that basumallik2022_abfp Eq. (3) makes explicit (ptc.abfp_output_norm)."

