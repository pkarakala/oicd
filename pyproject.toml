[project]
name = "oicd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranav Reddy", email = "preddy@ucsb.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
oicd = "oicd:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
