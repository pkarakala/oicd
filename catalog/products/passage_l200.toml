[[hypothesis]]
id = "H_l200_payload"
statement = "The L200 totals count payload: 50 Gb/s on each 56 Gb/s NRZ lane and 100 Gb/s on each 106/112 Gb/s PAM4 lane."
sets = { "l200.payload_56" = 50.0, "l200.payload_112" = 100.0 }
group = "l200_rate"

[[hypothesis]]
id = "H_l200_line"
statement = "The L200 totals count the line rate: 56 and 112 Gb/s per lane."
sets = { "l200.payload_56" = 56.0, "l200.payload_112" = 112.0 }
group = "l200_rate"
