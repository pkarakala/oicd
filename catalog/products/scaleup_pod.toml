[product]
name = "Scale-up pod example"
family = "Passage"
kind = "system"
status = "Example in vendor releases and talks, 2026"
summary = "The 512-accelerator scale-up pod Lightmatter uses to illustrate BiDi fiber and connector savings."

[[fact]]
id = "pod.fibers_before_cpx"
quantity = "fibers in a 512-GPU scale-up pod with conventional (non-BiDi) links"
value = 130000.0
bound = "approx"
unit = "count"
quote = "taking the pod from about 130,000 fibers to 65,000"
cite = "lm_pr_cpx"
source_class = "vendor_claim"
verified = true
location = "paragraph 2 (attributed to 'Lightmatter’s analysis in a recent tech brief')"
note = "Evidence: text."

[[fact]]
id = "pod.fibers_after_cpx"
quantity = "fibers in the same 512-GPU pod with BiDi links"
value = 65000.0
bound = "approx"
unit = "count"
quote = "taking the pod from about 130,000 fibers to 65,000"
cite = "lm_pr_cpx"
source_class = "vendor_claim"
verified = true
location = "paragraph 2 (attributed to 'Lightmatter’s analysis in a recent tech brief')"
note = "Evidence: text. Matches. Note: 'about' in the source precedes 130,000; 65,000 is exactly half, so it is marked approx as well."

[[fact]]
id = "pod.connectors_saved_cpx"
quantity = "connectors saved in a 512-GPU scale-up pod by BiDi"
value = 16000.0
bound = "approx"
unit = "count"
quote = "approximately 16,000 fewer connectors"
cite = "lm_pr_cpx"
source_class = "vendor_claim"
verified = true
