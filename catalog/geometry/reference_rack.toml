# Reference rack OICD-R64 (model card §14.9): an OICD design (SYNTHETIC), never the vendor's.
# Units: mm; x width, y depth (front at -y), z up; positions are part centers.
# Layout under H_2U (42 OU): XPU trays OU 1-16, power shelf OU 17, switch trays OU 18-25,
# power shelf OU 26, XPU trays OU 27-42; OU 43-44 spare. OU 1 starts 87 mm above the floor.

