location = "paragraph 2"
note = "Evidence: text. Matches. Unflagged conflict with HOTI26 '150 miles of fiber saved' for a 512 XPU cluster (pod.fiber_length_saved_hoti26); the Appendix lists both without marking the conflict."

[[fact]]
