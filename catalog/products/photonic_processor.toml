[[assumption]]
id = "ptc.output_range"
nominal = 128.0
low = 1.0
high = 128.0
unit = "count"
rationale = "Range of the ADC on the 128-term analog sum, in units of one product: n = 128 (basumallik2022_abfp Eq. 3) or 1 (the SI's Q_11 read literally). Pinned by H_out_n or H_out_1 (model card §15.3)."

[[assumption]]
id = "ptc.path_loss_db"
nominal = 1.35
low = 0.68
high = 2.7
unit = "dB"
rationale = "On-chip optical path from the fibre to a weight cell: 1 cm of Si ridge at the stated 1.35 dB/cm (range: 1 cm of SiN at 0.68 dB/cm to 2 cm of Si ridge). Path lengths are not disclosed (SYNTHETIC)."

[[assumption]]
