location = "paragraph 2"
note = "Evidence: text. Matches. Unflagged conflict with HOTI26 '20,000 Fewer connectors and failure points' for a 512 XPU cluster (pod.connectors_saved_hoti26); the Appendix lists both without marking the conflict."

[[fact]]
id = "pod.fiber_length_saved_cpx"
