# Lightmatter platform claims: public facts with exact quotes (brief 05 phase 4 fact check, 2026-10-18).
# Independent reconstruction from public information. Not affiliated with or endorsed by
# Lightmatter. Product names belong to their owners.

[product]
name = "Lightmatter platform claims"
family = "Lightmatter"
kind = "reference"
status = "Blog posts and slides, 2025 to 2026 (vendor claims)"
summary = "Claims that apply across products: thermal robustness, ring sizes and the company's founders."

[[fact]]
id = "lm.thermal_aggressor_rate"
quantity = "Equivalent thermal-aggressor rate a Passage link with Lightmatter MRM control survives (BER < 10^-9 pre-FEC); emulated by sweeping a tunable laser, not a measured on-chip temperature ramp"
value = 800.0
bound = "exact"
unit = "°C/s"
quote = "representing an 800℃/s temperature aggressor"
cite = "lm_blog_seeing"
source_class = "vendor_claim"
verified = true
conflicts_with = ["lm.thermal_rate_kumar"]
location = "paragraph after the results bullets, introducing Figure 1"
note = "Evidence: text. CONFLICT: Lightmatter's OFC 2026 slides say '>2000°C/s' (lm_ofc26_kumar slide 10; lm_yole_ofc26 slide 8) and '>1500°C/sec' (lm_yole_ofc26 slide 9). Methods differ: the blog converts a 50 nm/s laser sweep over 4 nm into an equivalent temperature rate, while the OFC 2026 slide plots an 'On Chip Thermal Aggressor' with dT/dt reaching about ±2000 °C/s. The source writes the unit with the ℃ sign (U+2103)."

[[fact]]
id = "lm.thermal_sweep_nm_per_s"
quantity = "Tunable-laser sweep rate used to emulate the thermal aggressor, over a 4 nm range"
value = 50.0
bound = "exact"
unit = "nm/s"
quote = "an effective 50 nm/s ramp rate over a 4 nm range"
cite = "lm_blog_seeing"
source_class = "vendor_claim"
verified = true
location = "paragraph after the results bullets, introducing Figure 1"
note = "Evidence: text."

