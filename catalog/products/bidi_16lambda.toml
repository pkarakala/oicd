# 16λ BiDi link: public facts with exact quotes (fact check, 2026-10-18).
# Independent model built from public information. Not affiliated with or endorsed by
# any company whose publications are cited.

[product]
name = "16λ BiDi link"
family = "photonic interconnect"
kind = "product"
status = "Demonstrated at OFC 2026 (public talk and technical blog)"
summary = "Single-fiber bidirectional WDM link with interleaved wavelength grids and microring transceivers (vendor descriptions)."

[[fact]]
id = "bidi16.bw_per_fiber"
quantity = "Throughput per fiber of the 16-lambda bidirectional link (both directions combined; slide 5 shows 8 wavelengths per direction, so about 400 Gbps each way by inference)"
value = 800.0
bound = "exact"
unit = "Gbps"
quote = "800 GBPS / FIBER"
cite = "vendor_ofc26_kumar"
source_class = "vendor_claim"
verified = true
location = "Page 4 bullet list ('The first 16-wavelength bidirectional link.'); title slide '16-Wavelength 800-Gbps Bidirectional Link'"
note = "Evidence: text."

[[fact]]
id = "bidi16.ber_no_fec"
quantity = "Bit error rate without FEC, 16-lambda BiDi link"
value = 1e-09
bound = "max"
unit = "BER"
quote = "BER < 1E-9, NO FEC"
cite = "vendor_ofc26_kumar"
source_class = "vendor_claim"
verified = true
location = "Page 4 bullet list; slide 12 plots per-lane BER for Lane_0-Lane_7 over insertions 0-9 against a 1e-9 line"
note = "Evidence: text."

