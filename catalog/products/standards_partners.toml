[[fact]]
id = "orv3.shelf_output_n1"
quantity = "ORv3 HPR V2 power shelf output power with N+1 PSU redundancy and dual cords"
value = 60.0
bound = "exact"
unit = "kW"
quote = "Output power: 60kW with N+1 and dual cords."
cite = "ocp_orv3_hpr72"
source_class = "published_spec"
verified = true
location = "p7, §4.1 Power shelf option 1 (same sentence for option 2, §4.2, p8)"
note = "Evidence: text. Value matches. The document is the '72kW' HPR V2 power shelf: each 1 OU shelf has '6x 12kW PSU slots' (72 kW installed; 'up to 72kW of capacity within a single 1OU shelf', p42), and 60 kW is the output rating with N+1 PSU redundancy and dual AC cords. The spec does not write '5+1'; 60 kW = 5 x 12 kW implies one of the six PSUs is the redundant unit (inference). §3 Overview: 'The power shelves shall house several PSUs with minimum of N+1 redundancy'."

[[fact]]
id = "orv3.chassis_1ou_max_height"
quantity = "recommended maximum height of a 1 OpenU IT chassis"
value = 44.7
bound = "max"
unit = "mm"
quote = "1 OpenU to 4 OpenU 48 X # OpenU - 3.3*"
cite = "ocp_orv3_itgear"
source_class = "published_spec"
verified = true
location = "p5, Table 1.0 ORv3 OpenU IT Gear Height Guidelines, column 'Recommended Maximum Height (mm)*' (also checked as image)"
note = "Evidence: text. 44.7 mm is not printed: it is computed from the formula 48 X # OpenU - 3.3 with 1 OpenU (the formula covers 1 to 4 OpenU; −3.4 for 5 to 7 OpenU, −3.5 for 8 to 10 OpenU, own analysis above 10 OpenU). It is a recommended maximum in a guide that says 'This document is a guideline and is not a hard requirement.', with assumptions in §1.2 (chassis weight ≤ 80 kg, evenly distributed, standard OpenU rack brackets)."

