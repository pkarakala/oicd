note = "Evidence: text."

[[fact]]
id = "bidi16.kitbidi_modulation_gbps"
quantity = "16λ BiDi kit modulation format and lane rate (Technical Specifications table)"
value = 56.0
bound = "exact"
unit = "Gbps"
quote = "Modulation 56 Gbps NRZ"
cite = "vendor_web_kitbidi"
