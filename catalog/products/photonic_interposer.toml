source_class = "vendor_claim"
verified = true
location = "page 11 (slide 'Unprecedented performance and scale', Specifications table); also checked on the rendered slide"
note = "Evidence: text. Matches. Explicitly counts Tx + Rx. ISES 2025 slide 11 also gives '114 Tbps' for the M-series."

