[[assumption]]
id = "interposer.two_directions"
nominal = 2.0
low = 2.0
high = 2.0
unit = "count"
rationale = "Each SerDes has a transmitter and a receiver, so 'Tx + Rx' counts every SerDes lane twice."

[[assumption]]
id = "interposer.energy_rate_divisor"
nominal = 1.0
low = 1.0
high = 2.0
unit = "count"
rationale = "Whether 2.3 pJ/bit applies to the Tx + Rx total (divisor 1) or to one direction (divisor 2); not disclosed. Pinned by H_interposer_txrx or H_interposer_per_dir."

[[assumption]]
id = "interposer.center_nm"
nominal = 1310.0
low = 1300.0
high = 1320.0
unit = "nm"
rationale = "O-band operating point taken as 1310 nm, as for the vendor's other WDM grids; the interposer grid is not disclosed."

