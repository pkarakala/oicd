# Two BiDi optical engines on one fiber (model card §13.7, §14.2). Units: mm. The fiber is drawn
# short; the link model uses its own length (0.5 km in the §13.8 case).

[scene]
id = "bidi_link"
name = "BiDi link: two BiDi engines on one fiber"
unit = "mm"
level = "package"
product = "bidi_engine"
parent = "bidi_engine"
breadcrumb = "BiDi link"
summary = "Direction A at 1311 nm and direction B at 1331 nm share one fiber; each end's diplexer separates them and the local transmitter's reflections become crosstalk."

[[part]]
id = "link.engine_a"
name = "engine A (transmits 1311 nm)"
assembly = "end A"
size = [37.5, 27.6, 4.55]
position = [-150.0, 0.0, 2.275]
material = "organic_substrate"
dims_class = "VENDOR"
dims_axes = ["VENDOR", "VENDOR", "VENDOR"]
dims_source = "engine.width_mm_yole"
nodes = ["engine.lambda_a_nm", "engine.length_mm_yole", "engine.height_mm_yole"]
enters = "bidi_engine"
label = "engine A: TX 1311 nm"

[[part]]
id = "link.engine_b"
name = "engine B (transmits 1331 nm)"
assembly = "end B"
size = [37.5, 27.6, 4.55]
position = [150.0, 0.0, 2.275]
material = "organic_substrate"
dims_class = "VENDOR"
dims_axes = ["VENDOR", "VENDOR", "VENDOR"]
dims_source = "engine.width_mm_yole"
nodes = ["engine.lambda_b_nm", "engine.length_mm_yole", "engine.height_mm_yole"]
enters = "bidi_engine"
label = "engine B: TX 1331 nm"

[[part]]
id = "link.fau_a"
name = "FAU, end A"
assembly = "end A"
size = [8.0, 14.0, 2.2]
position = [-127.0, 0.0, 5.65]
material = "glass"
dims_class = "SCHEMATIC"
dims_source = "FAU size not disclosed."
nodes = ["fau.il_reinsertion_max"]

[[part]]
id = "link.fau_b"
name = "FAU, end B"
assembly = "end B"
size = [8.0, 14.0, 2.2]
position = [127.0, 0.0, 5.65]
material = "glass"
dims_class = "SCHEMATIC"
dims_source = "FAU size not disclosed."
nodes = ["fau.il_reinsertion_max"]

[[part]]
id = "link.fiber"
name = "single-mode fiber (both directions)"
assembly = "channel"
shape = "tube"
size = [1.2, 1.2, 1.2]
path = [[-123.0, 0.0, 6.0], [-80.0, 0.0, 22.0], [0.0, 0.0, 30.0], [80.0, 0.0, 22.0], [123.0, 0.0, 6.0]]
material = "fiber"
dims_class = "SCHEMATIC"
dims_source = "Fiber drawn short and thick for visibility; length set in the link model."
nodes = ["itut.g652d_atten_max", "engine.fiber_reduction_pct"]
function = "One fiber per BiDi lane: half the fibers of a duplex DR link."
label = "one fiber, both directions"

[[tour]]
part = "link.engine_a"
node = "engine.lambda_a_nm"

[[tour]]
part = "link.engine_b"
node = "engine.lambda_b_nm"

[[tour]]
part = "link.fiber"
node = "engine.fiber_reduction_pct"

[[tour]]
part = "link.engine_b"
node = "engine.check_b_upper"

[[tour]]
part = "link.fau_a"
node = "fau.il_reinsertion_max"
