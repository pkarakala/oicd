# Passage L200/L200X (model card §14.4). Units: mm. Every dimension is SCHEMATIC: the release
# gives rates and counts, not sizes. Four chiplets per package is the INFERENCE 256 / 64.

[scene]
id = "passage_l200"
name = "Passage L200X co-packaged optics"
unit = "mm"
level = "package"
product = "passage_l200"
breadcrumb = "L200"
summary = "CPO chiplets beside an XPU die on one package, joined by a UCIe die-to-die interface, each feeding fibers at 16 wavelengths."

[[part]]
id = "l200g.substrate"
name = "package substrate"
assembly = "package"
size = [100.0, 80.0, 2.0]
position = [0.0, 0.0, 1.0]
material = "organic_substrate"
dims_class = "SCHEMATIC"
dims_source = "Package size not disclosed."
explode = [0.0, 0.0, -8.0]

[[part]]
id = "l200g.xpu"
name = "XPU die"
assembly = "dies"
size = [26.0, 33.0, 0.8]
position = [0.0, 0.0, 2.4]
material = "silicon"
dims_class = "SCHEMATIC"
dims_source = "Drawn at about reticle size; the XPU is the customer's."
explode = [0.0, 0.0, 6.0]
label = "XPU die"

[[part]]
id = "l200g.chiplets"
name = "L200X chiplets (4, INFERENCE from 256 / 64 Tbps)"
assembly = "dies"
size = [12.0, 30.0, 0.8]
position = [-24.0, 0.0, 2.4]
material = "silicon_eic"
dims_class = "SCHEMATIC"
dims_source = "Chiplet size not disclosed; count from l200.chiplets_per_package (assumption)."
nodes = ["l200.chiplets_per_package", "l200.serdes_count", "l200.bw_l200x", "l200.package_bw"]
count = 2
grid = [2, 1, 1]
pitch = [48.0, 0.0, 0.0]
explode = [0.0, 0.0, 6.0]
label = "L200X chiplet"

[[part]]
id = "l200g.chiplets_outer"
name = "L200X chiplets, outer pair"
assembly = "dies"
size = [12.0, 30.0, 0.8]
position = [-40.0, 0.0, 2.4]
material = "silicon_eic"
dims_class = "SCHEMATIC"
dims_source = "As the inner pair."
nodes = ["l200.chiplets_per_package"]
count = 2
grid = [2, 1, 1]
pitch = [80.0, 0.0, 0.0]
explode = [0.0, 0.0, 6.0]

[[part]]
id = "l200g.d2d"
name = "UCIe die-to-die interface regions"
assembly = "dies"
size = [1.0, 26.0, 0.05]
position = [-15.0, 0.0, 2.825]
material = "copper"
dims_class = "SCHEMATIC"
dims_source = "D2D region drawn as a strip between dies."
nodes = ["l200.ucie_d2d_rate", "l200.eic_partner"]
count = 2
grid = [2, 1, 1]
pitch = [30.0, 0.0, 0.0]
label = "UCIe D2D"

[[part]]
id = "l200g.fibers"
name = "fibers (40 per chiplet at 1.6 Tb/s, INFERENCE)"
assembly = "fibers"
shape = "cylinder"
size = [0.25, 0.25, 14.0]
position = [-49.0, -11.7, 3.0]
rotation_deg = [0.0, 90.0, 0.0]
material = "fiber"
dims_class = "SCHEMATIC"
dims_source = "Coated fiber at 250 um; 40 fibers from 64 Tbps / 1.6 Tb/s (INFERENCE)."
nodes = ["l200.fibers_l200x", "l200.bw_per_fiber_l200x", "l200.wdm_lambda_count"]
count = 40
grid = [1, 40, 1]
pitch = [0.0, 0.6, 0.0]
explode = [-10.0, 0.0, 0.0]
label = "40 fibers"

[[tour]]
part = "l200g.chiplets"
node = "l200.bw_l200x"

[[tour]]
part = "l200g.d2d"
node = "l200.ucie_d2d_rate"

[[tour]]
part = "l200g.fibers"
node = "l200.fibers_l200x"

[[tour]]
part = "l200g.chiplets"
node = "l200.package_bw"

[[tour]]
part = "l200g.chiplets"
node = "l200.web_modulation"
