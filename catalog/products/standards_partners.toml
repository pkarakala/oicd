# Standards and partner parts: public facts with exact quotes (fact check, 2026-10-18).
# Independent model built from public information. Not affiliated with or endorsed by
# any company whose publications are cited.

[product]
name = "Standards and partner parts"
family = "Reference"
kind = "reference"
status = "Published specifications, draft standards and partner datasheets"
summary = "ORv3 rack and power shelf, OCP NIC 3.0, OIF ELSFP and 3.2T CPO, ITU-T grids and fiber, the draft IEEE 802.3dj DR budget, PRIZM TMT and the OCP open silicon photonics vision."

[[fact]]
id = "prizm.insertion_loss"
quantity = "PRIZM TMT expanded-beam connector insertion loss, per connector"
value = 0.5
bound = "exact"
unit = "dB"
quote = "0.5 dB insertion loss"
cite = "corning_tmt_lan3581"
source_class = "published_spec"
verified = false
note = "Evidence: none. corning_tmt_lan3581 (LAN-3581-AEN.pdf) could not be opened: HTTP 403 Akamai 'Access Denied' on curl with a browser user agent (SRC/corning_tmt_lan3581_retry/raw.html), on curl with full browser headers (SRC/corning_tmt_lan3581_retry2/raw.bin), on the non-www and http:// variants (SRC/corning_tmt_lan3581_retry3/), and on WebFetch; the Wayback Machine has no capture of the PDF, archive.today returned 404, and a web search for 'LAN-3581-AEN' found no mirror. Web-search result summaries claimed the datasheet lists '0.5 dB insertion loss per connector', but I did not see the document, so this is not evidence. The same words '0.5 dB insertion loss' appear in the US Conec PRIZM TMT sheet (see prizm.usconec_insertion_loss; NEW source not in the initial source list), which does not say whether 0.5 dB is a maximum or typical value and does not say 'per connector'. The initial fact list wording: PRIZM TMT (corning_tmt_lan3581): \"0.5 dB insertion loss\" per connector"

