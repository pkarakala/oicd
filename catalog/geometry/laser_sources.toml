# external laser sources (ELS, ELS-DWDM, ELS-DR) (model card §14.5). Units: mm; x across, y depth
# (faceplate at -y), z up. Only the ELS-DR card's depth is a published dimension (OCP NIC 3.0,
# 115 mm for both sizes); its width is our SFF reading of "built to OCP NIC 3.0 dimensions".
# Every package, chip, laser and fiber position is SCHEMATIC.

[scene]
id = "laser_sources"
name = "External laser sources (ELS, ELS-DWDM, ELS-DR)"
unit = "mm"
level = "package"
product = "laser_sources"
parent = "switch_tray"
breadcrumb = "ELS-DR"
summary = "External laser sources: the ELS-DR laser NIC (64 lasers, 64 fibers at 200 mW), an ELS-DWDM package (8 wavelengths per fiber, 16 fibers, stackable) and the first ELS validation module (32 fibers)."

[[part]]
id = "elsdr.pcb"
name = "ELS-DR laser NIC board"
