# detachable fiber-array unit (FAU): public facts with exact quotes (fact check, 2026-10-18).
# Independent model built from public information. Not affiliated with or endorsed by
# any company whose publications are cited.

[product]
name = "Detachable fiber-array unit (FAU)"
family = "photonic interconnect"
kind = "product"
status = "Public technical material, 2026"
summary = "Detachable fiber-array unit with vertical expanded-beam coupling to the PIC, built with SENKO (vendor and partner descriptions)."

[[fact]]
id = "fau.il_reinsertion_max"
quantity = "FAU detachable FAU insertion and re-insertion loss, demonstrated (no wavelength, mating-cycle count or measurement conditions stated)"
value = 1.5
bound = "max"
unit = "dB"
quote = "A demonstrated insertion and re-insertion loss of less than 1.5 dB"
cite = "vendor_pr_fau"
source_class = "vendor_claim"
verified = true
conflicts_with = ["fau.il_futurum"]
location = "'Key advantages' list, 'Field Serviceability' item; paragraph 1 also says 'demonstrating a low insertion loss of less than 1.5 dB'"
note = "Evidence: text."

[[fact]]
id = "fau.wdm_span_nm"
quantity = "Spectral span over which FAU supports CWDM and DWDM (the vendor wording)"
value = 80.0
bound = "min"
unit = "nm"
quote = "Supports broadband (up to 80+ nanometers) Coarse Wavelength Division Multiplexing (CWDM) and Dense Wavelength Division Multiplexing (DWDM)"
cite = "vendor_pr_fau"
source_class = "vendor_claim"
verified = true
location = "'Key advantages' list, 'High Bandwidth DWDM Compatibility' item"
note = "Evidence: text. Wording only: the vendor writes 'up to 80+ nanometers' ('up to' qualifying an open-ended '80+'); SENKO writes 'more than 80 nm of spectrum' (fau.wdm_span_nm_senko). Recorded as min 80 nm. Neither source gives band edges or a center wavelength."

