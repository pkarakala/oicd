[[hypothesis]]
id = "H_chiplet_payload"
statement = "The 32T chiplet totals count payload: 50 Gb/s on each 56 Gb/s NRZ lane and 100 Gb/s on each 106/112 Gb/s PAM4 lane."
sets = { "chiplet.payload_56" = 50.0, "chiplet.payload_112" = 100.0 }
group = "chiplet_rate"

[[hypothesis]]
id = "H_chiplet_line"
statement = "The 32T chiplet totals count the line rate: 56 and 112 Gb/s per lane."
sets = { "chiplet.payload_56" = 56.0, "chiplet.payload_112" = 112.0 }
group = "chiplet_rate"
