# CPO chiplet (32T and 64T): public facts with exact quotes (brief 05 phase 4 fact check, 2026-10-18).
# Independent model built from public information. Not affiliated with or endorsed by
# any company whose publications are cited.

[product]
name = "CPO chiplet (32T and 64T)"
