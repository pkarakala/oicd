# Photonic processor (Nature 2025): public facts with exact quotes (fact check, 2026-10-18).
# Independent model built from public information. Not affiliated with or endorsed by
# any company whose publications are cited.

[product]
name = "Photonic processor (Nature 2025)"
family = "Photonic compute"
kind = "product"
status = "Published in Nature 640, 368 to 374 (2025)"
summary = "Six-chip photonic processor: four photonic tensor cores under two control dies, running neural networks in adaptive block floating point (peer-reviewed, vendor-authored)."

[[fact]]
id = "ptc.chip_count"
quantity = "chips in the photonic processor package"
value = 6.0
bound = "exact"
unit = "count"
quote = "The processor integrates six chips within a single package"
cite = "vendor_blog_newcomputer"
source_class = "vendor_claim"
verified = true
location = "blog section 'A Fundamental Departure', paragraph 4"
note = "Evidence: text. The initial list attributes this to ahmed2025_nature (PEER_REVIEWED), whose main text is paywalled and was not seen. The word 'six' was found only in the vendor blog (vendor_claim, Nick Harris, 2025-04-09). Peer-reviewed material agrees on the parts: Fig. 1b caption 'two 12-nm control chiplets ... and four 349-mm2 photonic chiplets' and SI p.5 'two DCIs ... four PTCs' (2 + 4 = 6)."

