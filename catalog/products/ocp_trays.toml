# ---- Model (model card §14.7) ---------------------------------------------

[[assumption]]
id = "trays.bw_divisor"
nominal = 1.0
low = 1.0
high = 2.0
unit = "count"
rationale = "Whether the tray totals are per direction (1) or aggregate of both directions (2); not disclosed. Pinned by H_dir or H_agg."

[[assumption]]
id = "trays.ine_reading"
nominal = 2.0
low = 2.0
high = 2.0
unit = "count"
rationale = "ine_ocp26 calls 204.8 Tbps 'aggregate' switching bandwidth, read as both directions (INFERENCE)."

[[assumption]]
id = "trays.xpu_height_ru"
nominal = 1.0
low = 1.0
high = 2.0
unit = "RU"
rationale = "XPU tray height: 1 RU (PR Newswire copy, Futurum) or 2 RU (vendor-site copy, Counterpoint, IN Electronics). Pinned by H_xpu_1u or H_xpu_2u."

[[derived]]
id = "trays.switch_per_engine"
fn = "divide_by_count"
inputs = ["trays.switch_bw", "trays.switch_engines"]
unit = "Tbps"
note = "204.8 Tbps over 8 engines"

[[derived]]
id = "trays.xpu_per_engine"
fn = "divide_by_count"
inputs = ["trays.xpu_bw", "trays.xpu_engines"]
unit = "Tbps"
note = "102.4 Tbps over 4 engines"

[[derived]]
id = "trays.engine_in_bidi_engines"
fn = "ratio"
inputs = ["trays.switch_per_engine", "engine.bw_per_direction"]
unit = "1"
note = "tray engine bandwidth in BiDi engines per direction (the release does not name the engine, INFERENCE)"

[[derived]]
id = "trays.switch_bw_per_dir"
fn = "divide_by_count"
inputs = ["trays.switch_bw", "trays.bw_divisor"]
unit = "Tbps"
note = "switch tray bandwidth each way"

[[derived]]
id = "trays.switch_lanes"
fn = "lanes"
inputs = ["trays.switch_bw_per_dir", "engine.lane_rate"]
unit = "count"
note = "200G lanes each way (lane rate not disclosed; the BiDi engine's, INFERENCE)"

[[derived]]
id = "trays.switch_els_dr_needed"
fn = "count_ratio"
inputs = ["trays.switch_lanes", "els_dr.lanes"]
unit = "count"
note = "ELS-DR modules at 256 lanes each"

[[derived]]
id = "trays.xpu_bw_per_dir"
fn = "divide_by_count"
inputs = ["trays.xpu_bw", "trays.bw_divisor"]
unit = "Tbps"
note = "XPU tray bandwidth each way"

[[derived]]
id = "trays.xpu_lanes"
fn = "lanes"
inputs = ["trays.xpu_bw_per_dir", "engine.lane_rate"]
unit = "count"
note = "200G lanes each way"

[[derived]]
id = "trays.xpu_els_dr_needed"
fn = "count_ratio"
inputs = ["trays.xpu_lanes", "els_dr.lanes"]
unit = "count"
note = "ELS-DR modules for the XPU tray"

[[derived]]
id = "trays.xpu_bw_per_xpu"
fn = "divide_by_count"
inputs = ["trays.xpu_bw_per_dir", "trays.xpu_accelerators"]
unit = "Tbps"
note = "bandwidth per accelerator each way"

