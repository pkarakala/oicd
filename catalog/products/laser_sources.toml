[[hypothesis]]
id = "H_chain_lossier"
statement = "ELS-DR's 200 mW for 4 lanes is sized for a chain that loses about 6.4 dB more than the SYNTHETIC §10 chain."
sets = { "els_dr.chain_extra_db" = 6.4398, "els_dr.provisioning_db" = 0.0 }
group = "guidedr_margin"

[[hypothesis]]
id = "H_laser_headroom"
statement = "The §10 chain is about right and ELS-DR provisions about 6.4 dB for aging, temperature and TDECQ corners."
sets = { "els_dr.chain_extra_db" = 0.0, "els_dr.provisioning_db" = 6.4398 }
group = "guidedr_margin"
