cite = "vendor_blog_seeing"
source_class = "vendor_claim"
verified = true
location = "section 'Hot Interconnects: Redefining Performance and Efficiency', 'Unprecedented Efficiency' bullet"
note = "Evidence: text."

[[fact]]
id = "bidi16.kitbidi_bw_per_dir_gbps"
